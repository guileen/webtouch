<!doctype html>
<html><head><meta charset="utf-8"><title>vlm coord probe 3</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#101418}</style>
</head><body>
<canvas id="cv"></canvas>
<script>
const ROWS = 12;
const LABEL = i => 'ROW ' + String(i+1).padStart(2, '0');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
window.__probe = { drawn: [], events: [] };
function liveTargets(){
  const w = innerWidth, h = innerHeight;
  const bw = 960, bh = 40, x0 = (w-bw)/2, y0 = 60, step = 60;
  return Array.from({length: ROWS}, (_, i) => ({ name: LABEL(i), cx: Math.round(x0+bw/2), cy: Math.round(y0 + i*step + bh/2), w: bw, h: bh }));
}
function layout(){
  const w = innerWidth, h = innerHeight, dpr = devicePixelRatio;
  cv.style.width = w+'px'; cv.style.height = h+'px';
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = '#101418'; ctx.fillRect(0,0,w,h);
  const t = liveTargets();
  for (const [i,o] of t.entries()){
    ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(o.cx-o.w/2, o.cy-o.h/2, o.w, o.h);
    ctx.fillStyle = '#dfe7ee';
    ctx.font = 'bold 20px Helvetica, Arial, sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(o.name, o.cx-o.w/2+16, o.cy);
  }
  window.__probe.drawn = t;
}
function metrics(){
  const c = document.getElementById('cv');
  return { innerW: innerWidth, innerH: innerHeight, dpr: devicePixelRatio,
    cvW: c.width, cvH: c.height, cvCssW: c.clientWidth, cvCssH: c.clientHeight,
    drawn: window.__probe.drawn, live: liveTargets() };
}
function beacon(kind, extra){
  const q = new URLSearchParams();
  q.set('kind', kind); q.set('m', JSON.stringify(metrics()));
  for (const k in extra) q.set(k, String(extra[k]));
  new Image().src = '/__probe?' + q.toString() + '&r=' + Math.random();
}
for (const t of ['mousedown','mouseup','click']){
  addEventListener(t, function(e){
    const el = document.elementFromPoint(e.clientX, e.clientY);
    beacon('event', { type: t, cx: e.clientX, cy: e.clientY, ox: e.offsetX, oy: e.offsetY,
      topEl: el ? (el.tagName + (el.id ? '#'+el.id : '')) : '' });
  }, true);
}
addEventListener('resize', layout);
layout();
beacon('ready', {});
window.__ready = true;
</script>
</body></html>
