<!doctype html>
<html><head><meta charset="utf-8"><title>vlm coord probe 2</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#101418}canvas{display:block}</style>
</head><body>
<canvas id="cv"></canvas>
<script>
const SPEC = [
  { name: "SETTINGS", fx: 0.30, fy: 0.30, w: 120, h: 44 },
  { name: "EDIT",     fx: 0.70, fy: 0.70, w: 60,  h: 20 }
];
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
window.__probe = { drawn: [], events: [] };
function liveTargets(){
  const w = innerWidth, h = innerHeight;
  return SPEC.map(o => ({ name: o.name, cx: Math.round(o.fx*w), cy: Math.round(o.fy*h), w: o.w, h: o.h }));
}
function layout(){
  const w = innerWidth, h = innerHeight, dpr = devicePixelRatio;
  cv.style.width = w+'px'; cv.style.height = h+'px';
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = '#101418'; ctx.fillRect(0,0,w,h);
  const t = liveTargets();
  for (const o of t){
    ctx.fillStyle = '#7ad3ff'; ctx.fillRect(o.cx-o.w/2, o.cy-o.h/2, o.w, o.h);
    ctx.fillStyle = '#08222f';
    ctx.font = 'bold '+Math.round(o.h*0.5)+'px Helvetica, Arial, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(o.name, o.cx, o.cy);
  }
  window.__probe.drawn = t;
}
function metrics(){
  const c = document.getElementById('cv');
  return { innerW: innerWidth, innerH: innerHeight, dpr: devicePixelRatio,
    cvW: c.width, cvH: c.height, cvCssW: c.clientWidth, cvCssH: c.clientHeight,
    drawn: window.__probe.drawn, live: liveTargets() };
}
function beacon(kind, extra){
  const q = new URLSearchParams();
  q.set('kind', kind); q.set('m', JSON.stringify(metrics()));
  for (const k in extra) q.set(k, String(extra[k]));
  new Image().src = '/__probe?' + q.toString() + '&r=' + Math.random();
}
for (const t of ['mousedown','mouseup','click']){
  addEventListener(t, function(e){
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const ev = { type: t, clientX: e.clientX, clientY: e.clientY, offsetX: e.offsetX, offsetY: e.offsetY,
      at: Math.round(performance.now()), topEl: el ? (el.tagName + (el.id ? '#'+el.id : '')) : null };
    window.__probe.events.push(ev);
    beacon('event', { type: t, cx: e.clientX, cy: e.clientY, ox: e.offsetX, oy: e.offsetY, topEl: ev.topEl });
  }, true);
}
addEventListener('resize', layout);
layout();
beacon('ready', {});
window.__ready = true;
</script>
</body></html>
