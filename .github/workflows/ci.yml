name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.0'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Install ripgrep
        run: |
          if ! command -v rg >/dev/null; then
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get update
              sudo apt-get install -y ripgrep
            else
              brew install ripgrep
            fi
          fi
      - name: Install dependencies and generators
        run: |
          uv sync --frozen --group dev --python 3.11
          bash scripts/ci-bootstrap.sh
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - name: Verify
        run: make -k ci
      - name: Check generated files and lockfiles
        run: git diff --exit-code -- go.mod go.sum uv.lock proto/gen
